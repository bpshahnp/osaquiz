<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Timer System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3182ce;
            --primary-red: #e53e3e;
            --primary-green: #48bb78;
            --success-green: #00c559;
            --warning-orange: #ed8936;
            --dark-red: #c53030;
            --dark-green: #38a169;
            --light-gray: #f7fafc;
            --border-gray: #e2e8f0;
            --text-dark: #333;
            --text-medium: #4a5568;
            --text-light: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-gray);
            color: var(--text-dark);
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: var(--primary-blue);
            padding: 12px 25px;
            color: white;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header-top {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .school-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .school-logo img {
            width: 78px;
            height: 78px;
            object-fit: contain;
        }

        .school-info h1 {
            font-family: 'Belwe MT', 'Times New Roman', serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
        }

        .school-tagline {
            font-size: 0.9rem;
            color: #e2e8f0;
            font-style: italic;
            opacity: 0.9;
        }

        .competition-section {
            text-align: center;
        }

        .competition-title {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: white;
            padding: 12px 25px;
            border-radius: 15px;
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            display: inline-block;
            box-shadow: 0 8px 25px rgba(229, 62, 62, 0.4);
        }

        .main-content {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px;
        }

        /* Timer Section - Left Side */
        .timer-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
        }

        .timer-display {
            width: 100%;
            background: linear-gradient(135deg, var(--primary-blue), #2c5282);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(49, 130, 206, 0.3);
            transition: all 0.3s ease;
        }

        .timer-display.warning {
            background: linear-gradient(135deg, var(--warning-orange), #c05621);
            animation: pulse 1s infinite;
        }

        .timer-display.finished {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .timer-time {
            font-size: 6rem;
            font-weight: 700;
            color: white;
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            letter-spacing: 0.1em;
        }

        .timer-controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .time-setter {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .time-setter input {
            width: 80px;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            border: 2px solid var(--border-gray);
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
        }

        .time-setter span {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-medium);
        }

        .timer-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        .btn-start {
            background: var(--primary-green);
            color: white;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        }

        .btn-start:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
        }

        .btn-pause {
            background: var(--warning-orange);
            color: white;
            box-shadow: 0 4px 15px rgba(237, 137, 54, 0.3);
        }

        .btn-pause:hover {
            background: #c05621;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: var(--primary-red);
            color: white;
            box-shadow: 0 4px 15px rgba(229, 62, 62, 0.3);
        }

        .btn-reset:hover {
            background: var(--dark-red);
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* Question Section - Right Side */
        .question-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-gray);
        }

        .question-link {
            background: var(--primary-green);
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
        }

        .question-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
        }

        .question-link.active {
            background: var(--primary-blue);
        }

        .question-content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .question-header {
            background-color: var(--primary-red);
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            display: inline-block;
            align-self: flex-start;
        }

        .question-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .question-text {
            background-color: var(--primary-blue);
            color: white;
            padding: 25px;
            border-radius: 10px;
            font-size: 1.6rem;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
        }

        .reveal-container {
            text-align: center;
        }

        .reveal-btn {
            background-color: var(--primary-green);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(72, 187, 120, 0.3);
            font-family: 'Poppins', sans-serif;
        }

        .reveal-btn:hover:not(:disabled) {
            background-color: var(--dark-green);
            transform: translateY(-2px);
        }

        .reveal-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .answer-section {
            background: #fff5f5;
            border: 2px solid #fed7d7;
            border-radius: 10px;
            padding: 20px;
            display: none;
            animation: slideDown 0.3s ease-out;
        }

        .answer-section.visible {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .answer-content {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .answer-label {
            background-color: var(--success-green);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1.4rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .answer-text {
            background: var(--light-gray);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            color: var(--text-medium);
            line-height: 1.5;
            flex: 1;
        }

        .no-question {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }

        .no-question h2 {
            font-size: 2rem;
            margin-bottom: 15px;
        }

        /* Responsive Design */
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .timer-time {
                font-size: 4rem;
            }
        }

        @media (max-width: 768px) {
            .header-top {
                flex-direction: column;
                text-align: center;
            }

            .timer-time {
                font-size: 3.5rem;
            }

            .question-text {
                font-size: 1.3rem;
            }

            .answer-content {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-top">
                <div class="school-logo">
                    <img src="https://via.placeholder.com/80" alt="School Logo">
                </div>
                <div class="school-info">
                    <h1>HIMALAYAN WHITEHOUSE INTERNATIONAL COLLEGE</h1>
                    <p class="school-tagline">Excellence in Education</p>
                </div>
            </div>
            <div class="competition-section">
                <div class="competition-title">Mental Math Competition</div>
            </div>
        </header>

        <main class="main-content">
            <!-- Timer Section - Left Side -->
            <div class="timer-section">
                <div class="timer-display" id="timerDisplay">
                    <div class="timer-time" id="timerTime">00:00</div>
                </div>

                <div class="timer-controls">
                    <div class="time-setter">
                        <input type="number" id="minutesInput" value="1" min="0" max="59">
                        <span>:</span>
                        <input type="number" id="secondsInput" value="30" min="0" max="59">
                    </div>
                    <div class="timer-buttons">
                        <button class="btn btn-start" id="startBtn">Start</button>
                        <button class="btn btn-pause" id="pauseBtn" disabled>Pause</button>
                        <button class="btn btn-reset" id="resetBtn">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Question Section - Right Side -->
            <div class="question-section">
                <div class="question-nav" id="questionNav"></div>
                
                <div class="question-content-area" id="questionContent">
                    <div class="no-question">
                        <h2>Welcome!</h2>
                        <p>Select a question to begin</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const questions = [
            { id: 1, question: "What is 25 × 4?", answer: "100" },
            { id: 2, question: "What is 144 ÷ 12?", answer: "12" },
            { id: 3, question: "What is 15² ?", answer: "225" },
            { id: 4, question: "What is √196 ?", answer: "14" },
            { id: 5, question: "What is 99 + 87?", answer: "186" },
            { id: 6, question: "What is 1000 - 347?", answer: "653" },
            { id: 7, question: "What is 18 × 7?", answer: "126" },
            { id: 8, question: "What is 256 ÷ 16?", answer: "16" }
        ];

        let currentQuestion = null;
        let timerInterval = null;
        let totalSeconds = 90;
        let remainingSeconds = 90;
        let isRunning = false;

        // Timer functions
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        function updateTimerDisplay() {
            document.getElementById('timerTime').textContent = formatTime(remainingSeconds);
            const timerDisplay = document.getElementById('timerDisplay');
            
            timerDisplay.classList.remove('warning', 'finished');
            if (remainingSeconds === 0) {
                timerDisplay.classList.add('finished');
                stopTimer();
            } else if (remainingSeconds <= 10) {
                timerDisplay.classList.add('warning');
            }
        }

        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('minutesInput').disabled = true;
            document.getElementById('secondsInput').disabled = true;

            timerInterval = setInterval(() => {
                if (remainingSeconds > 0) {
                    remainingSeconds--;
                    updateTimerDisplay();
                } else {
                    stopTimer();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
        }

        function resetTimer() {
            stopTimer();
            const minutes = parseInt(document.getElementById('minutesInput').value) || 0;
            const seconds = parseInt(document.getElementById('secondsInput').value) || 0;
            totalSeconds = minutes * 60 + seconds;
            remainingSeconds = totalSeconds;
            updateTimerDisplay();
            document.getElementById('minutesInput').disabled = false;
            document.getElementById('secondsInput').disabled = false;
        }

        // Question functions
        function renderQuestions() {
            const nav = document.getElementById('questionNav');
            nav.innerHTML = questions.map(q => 
                `<button class="question-link" data-id="${q.id}">Q${q.id}</button>`
            ).join('');

            nav.querySelectorAll('.question-link').forEach(btn => {
                btn.addEventListener('click', () => selectQuestion(parseInt(btn.dataset.id)));
            });
        }

        function selectQuestion(id) {
            currentQuestion = questions.find(q => q.id === id);
            
            document.querySelectorAll('.question-link').forEach(link => {
                link.classList.remove('active');
                if (parseInt(link.dataset.id) === id) {
                    link.classList.add('active');
                }
            });

            renderQuestion();
        }

        function renderQuestion() {
            const content = document.getElementById('questionContent');
            
            if (!currentQuestion) {
                content.innerHTML = `
                    <div class="no-question">
                        <h2>Welcome!</h2>
                        <p>Select a question to begin</p>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="question-header">
                    <h3>Question ${currentQuestion.id}</h3>
                </div>
                <div class="question-text">${currentQuestion.question}</div>
                <div class="reveal-container">
                    <button class="reveal-btn" id="revealBtn">Reveal Answer</button>
                </div>
                <div class="answer-section" id="answerSection">
                    <div class="answer-content">
                        <div class="answer-label">Answer:</div>
                        <div class="answer-text">${currentQuestion.answer}</div>
                    </div>
                </div>
            `;

            document.getElementById('revealBtn').addEventListener('click', revealAnswer);
        }

        function revealAnswer() {
            const answerSection = document.getElementById('answerSection');
            const revealBtn = document.getElementById('revealBtn');
            
            answerSection.classList.add('visible');
            revealBtn.disabled = true;
            revealBtn.textContent = 'Answer Revealed';
        }

        // Event listeners
        document.getElementById('startBtn').addEventListener('click', startTimer);
        document.getElementById('pauseBtn').addEventListener('click', pauseTimer);
        document.getElementById('resetBtn').addEventListener('click', resetTimer);

        document.getElementById('minutesInput').addEventListener('change', function() {
            this.value = Math.max(0, Math.min(59, parseInt(this.value) || 0));
        });

        document.getElementById('secondsInput').addEventListener('change', function() {
            this.value = Math.max(0, Math.min(59, parseInt(this.value) || 0));
        });

        // Initialize
        renderQuestions();
        updateTimerDisplay();
    </script>
</body>
</html>
